<script src="assets/js/main.min.js"></script>
<script src="assets/js/darkmode.js" defer></script>

{% include analytics.html %}

<script>
  // Mobile nav toggle
  (function () {
    var burger = document.querySelector('.ox-topnav__burger');
    var nav    = document.querySelector('.ox-topnav');
    if (!burger || !nav) return;
    function closeMenu() {
      nav.setAttribute('data-open', 'false');
      burger.setAttribute('aria-expanded', 'false');
    }
    burger.addEventListener('click', function () {
      var open = nav.getAttribute('data-open') === 'true';
      nav.setAttribute('data-open', !open);
      burger.setAttribute('aria-expanded', !open);
    });
    nav.querySelectorAll('.ox-topnav__links a').forEach(function (link) {
      link.addEventListener('click', closeMenu);
    });
    var logo = nav.querySelector('.ox-topnav__logo');
    if (logo) logo.addEventListener('click', closeMenu);
    var themeToggle = nav.querySelector('[data-theme-toggle]');
    if (themeToggle) themeToggle.addEventListener('click', closeMenu);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav.getAttribute('data-open') === 'true') {
        closeMenu();
        burger.focus();
      }
    });
    document.addEventListener('click', function (e) {
      if (nav.getAttribute('data-open') === 'true' && !nav.contains(e.target)) closeMenu();
    });
  })();

  // Topnav: add blurred/translucent style once the page is scrolled
  (function () {
    var nav = document.querySelector('.ox-topnav');
    if (!nav) return;
    var ticking = false;
    function update() {
      var scrolled = (window.scrollY || document.documentElement.scrollTop) > 12;
      nav.setAttribute('data-scrolled', scrolled ? 'true' : 'false');
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
    update();
  })();

  // BibTeX: expand/collapse + copy
  (function () {
    document.addEventListener('click', function (e) {
      var toggle = e.target.closest('[data-bib-toggle]');
      if (toggle) {
        var panel = document.getElementById(toggle.dataset.bibToggle);
        if (!panel) return;
        var isOpen = !panel.hasAttribute('hidden');
        if (isOpen) {
          panel.setAttribute('hidden', '');
          toggle.setAttribute('aria-expanded', 'false');
        } else {
          panel.removeAttribute('hidden');
          toggle.setAttribute('aria-expanded', 'true');
        }
        return;
      }
      var copy = e.target.closest('[data-bib-copy]');
      if (copy) {
        var code = document.getElementById(copy.dataset.bibCopy);
        if (!code) return;
        var text = code.textContent;
        var done = function () {
          var orig = copy.textContent;
          copy.textContent = 'Copied';
          copy.setAttribute('data-copied', 'true');
          setTimeout(function () {
            copy.textContent = orig;
            copy.removeAttribute('data-copied');
          }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () {
            // fallback below
            fallbackCopy(text); done();
          });
        } else {
          fallbackCopy(text); done();
        }
      }
    });
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
  })();

  // Older links used emoji-derived ids such as #-publications; send them to the current #publications.
  (function () {
    var hash = window.location.hash;
    if (!/^#-[\w-]+$/.test(hash) || document.getElementById(hash.slice(1))) return;
    var target = document.getElementById(hash.slice(2));
    if (target) window.location.replace('#' + target.id);
  })();

  // Section-aware navigation
  (function () {
    function onReady(fn) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fn);
      } else {
        fn();
      }
    }

    onReady(function () {
      // Keep one nav item active throughout its section.
      var sections = [];
      document.querySelectorAll('.ox-topnav__links a[href*="#"]').forEach(function (link) {
        var id = link.hash.slice(1);
        var target = document.getElementById(id);
        if (target) sections.push({ link: link, target: target });
      });
      if (!sections.length) return;

      var activeTicking = false;
      function updateActive() {
        var active = sections[0];
        for (var i = 0; i < sections.length; i++) {
          if (sections[i].target.getBoundingClientRect().top <= 160) active = sections[i];
          else break;
        }
        var doc = document.documentElement;
        if (window.scrollY + window.innerHeight >= doc.scrollHeight - 2) {
          active = sections[sections.length - 1];
        }
        sections.forEach(function (section) {
          if (section === active) {
            section.link.setAttribute('data-active', 'true');
            section.link.setAttribute('aria-current', 'location');
          } else {
            section.link.removeAttribute('data-active');
            section.link.removeAttribute('aria-current');
          }
        });
        activeTicking = false;
      }
      function queueActive() {
        if (!activeTicking) {
          window.requestAnimationFrame(updateActive);
          activeTicking = true;
        }
      }
      window.addEventListener('scroll', queueActive, { passive: true });
      window.addEventListener('resize', queueActive, { passive: true });
      updateActive();
    });
  })();

  // Reading progress bar.
  (function () {
    var bar = document.querySelector('.ox-progress');
    if (!bar) return;
    var ticking = false;
    function update() {
      var doc = document.documentElement;
      var scrollTop = window.scrollY || doc.scrollTop || 0;
      var height = Math.max(0, (doc.scrollHeight || document.body.scrollHeight) - (doc.clientHeight || window.innerHeight));
      var ratio = height > 0 ? Math.min(Math.max(scrollTop / height, 0), 1) : 0;
      bar.style.transform = 'scaleX(' + ratio + ')';
      ticking = false;
    }
    function queueUpdate() {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }
    window.addEventListener('scroll', queueUpdate, { passive: true });
    window.addEventListener('resize', queueUpdate, { passive: true });
    update();
  })();

  // Back-to-top button: appear after 800px scroll, smooth-scroll to top on click
  (function () {
    var btn = document.querySelector('.ox-to-top');
    if (!btn) return;
    var ticking = false;
    var threshold = 800;
    function update() {
      var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
      btn.setAttribute('data-visible', scrollTop > threshold ? 'true' : 'false');
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
    btn.addEventListener('click', function () {
      var prefersReduced = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      try {
        window.scrollTo({
          top: 0,
          left: 0,
          behavior: prefersReduced ? 'auto' : 'smooth'
        });
      } catch (e) {
        window.scrollTo(0, 0);
      }
    });
    update();
  })();

</script>
